<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PaddleRank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full mx-auto px-6 py-12">
    <a href="index.html" class="text-zinc-400 mb-8 inline-block">← Back</a>

    <div class="bg-zinc-900 rounded-3xl p-10">
      <h1 class="text-4xl font-bold text-center mb-8">PaddleRank</h1>
      <p class="text-center mb-8">Create your account</p>

      <form id="signupForm">
        <input type="text" id="full_name" placeholder="Full Name" required class="w-full mb-4 p-4 bg-zinc-800 rounded-2xl">
        <input type="email" id="email" placeholder="Email" required class="w-full mb-4 p-4 bg-zinc-800 rounded-2xl">
        <input type="password" id="password" placeholder="Password" required class="w-full mb-6 p-4 bg-zinc-800 rounded-2xl">

        <button type="submit" id="submitBtn"
                class="w-full bg-green-600 py-6 rounded-3xl font-semibold text-xl">
          Create Free Account
        </button>
      </form>
    </div>
  </div>

  <script>
    console.log("Signup page loaded");

    const supabaseUrl = 'https://zfgdbbgpttgtnkjkhcia.supabase.co';
    const supabaseAnonKey = 'sb_publishable_lIlxAguIYp5mnmkfB09PMQ_4eFfLd02';
    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();   // This should stop the refresh
      console.log("Form submitted - preventDefault worked");

      const btn = document.getElementById('submitBtn');
      btn.textContent = "Creating...";
      btn.disabled = true;

      alert("✅ JavaScript is working! Form was submitted without refresh.");

      // We'll add real signup code after we confirm this works
      btn.textContent = "Create Free Account";
      btn.disabled = false;
    });
  </script>
</body>
</html>
