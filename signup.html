<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PaddleRank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #09090b; }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full mx-auto px-6 py-12">
    <!-- Back Button -->
    <a href="index.html" class="inline-flex items-center text-zinc-400 hover:text-white mb-8">
      ← Back to Home
    </a>

    <div class="bg-zinc-900 rounded-3xl p-10 border border-zinc-800">
      <div class="text-center mb-10">
        <h1 class="text-5xl font-bold mb-3">PaddleRank</h1>
        <p class="text-2xl font-light">Create your account</p>
        <p class="text-zinc-400 mt-2">Start tracking your pickleball hours today</p>
      </div>

      <form id="signupForm" class="space-y-6">
        <div>
          <label class="block text-sm text-zinc-400 mb-2">Full Name</label>
          <input type="text" id="name" required 
                 class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-green-500 text-lg">
        </div>

        <div>
          <label class="block text-sm text-zinc-400 mb-2">Email Address</label>
          <input type="email" id="email" required 
                 class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-green-500 text-lg">
        </div>

        <div>
          <label class="block text-sm text-zinc-400 mb-2">Password</label>
          <input type="password" id="password" required minlength="6"
                 class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-green-500 text-lg">
        </div>

        <div>
          <label class="block text-sm text-zinc-400 mb-2">Skill Level (Optional)</label>
          <select id="skill" 
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-green-500 text-lg">
            <option value="">Select your level</option>
            <option value="2.5-3.0">2.5 - 2.9</option>
            <option value="3.0-3.5" selected>3.0 - 3.4</option>
            <option value="3.5-4.0">3.5 - 4.0</option>
            <option value="4.0+">4.0+</option>
          </select>
        </div>

        <button type="submit" 
                class="w-full bg-green-600 hover:bg-green-500 py-6 rounded-3xl font-semibold text-xl transition mt-8">
          Create Free Account
        </button>
      </form>

      <p class="text-center text-xs text-zinc-500 mt-8">
        By creating an account, you agree to our Terms and Privacy Policy.<br>
        Your data is secure.
      </p>
    </div>

    <p class="text-center text-zinc-500 text-sm mt-8">
      Already have an account? <a href="#" class="text-green-400 hover:underline">Sign in</a>
    </p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      
      alert(`🎉 Welcome to PaddleRank, ${name.split(" ")[0]}!\n\nYour account has been created.\n\n(Next step: We'll build the actual dashboard soon)`);
    });
  </script>
</body>
</html>
